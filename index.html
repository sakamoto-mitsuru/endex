<style>
  :root{
    --portrait-ink:#3a3228; --portrait-muted:#888888;
    --portrait-line:#eeeeee; --portrait-line-strong:#c4b5a3;
    --portrait-card:#ffffff; --portrait-panel:#f5f0e8;
    --portrait-primary:#555555; --portrait-primary-dark:#222222;
    --portrait-radius-card:0.75rem; --portrait-radius-pill:9999px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--portrait-panel);color:var(--portrait-ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    -webkit-text-size-adjust:100%;overflow:hidden;
    display:grid;grid-template-rows:minmax(0,1fr);justify-items:center;
    padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom))}

  .top{display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    gap:clamp(14px,2.6vh,30px);
    width:100%;max-width:820px;height:100%;min-height:0;justify-items:center;text-align:center}

  /* ── 見出し ── */
  .head{display:grid;gap:10px;justify-items:center}
  .brand{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:15px;letter-spacing:.34em;color:var(--portrait-line-strong);
    text-indent:.34em}
  h1{font-size:clamp(24px,4.4vw,38px);font-weight:600;line-height:1.5;
    letter-spacing:.05em}
  h1 .em{position:relative;white-space:nowrap}
  h1 .em::after{content:"";position:absolute;left:0;right:0;bottom:-.1em;
    height:1px;background:var(--portrait-line-strong)}
  .sub{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:clamp(16px,2vw,19px);line-height:1.9;color:var(--portrait-muted);
    letter-spacing:.04em}

  /* ── 巡回する絵 ── */
  .stage{position:relative;width:100%;height:100%;min-height:0;
    display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;
    justify-items:center;align-items:center}
  .frame{position:relative;width:100%;height:100%;min-height:0}
  .shot{position:absolute;inset:0;display:grid;
    grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);
    place-items:center;opacity:0;transition:opacity 1.1s ease}
  .shot--on{opacity:1}
  .shot img{display:block;width:100%;height:100%;object-fit:contain;
    border-radius:var(--portrait-radius-card);
    box-shadow:0 10px 34px rgba(58,50,40,.14)}
  @media (prefers-reduced-motion:reduce){.shot{transition:none}}

  /* 工程の名前とドット */
  .track{display:flex;gap:14px;align-items:center;justify-content:center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  .step{display:flex;gap:6px;align-items:center;font-size:15px;
    color:var(--portrait-line-strong);letter-spacing:.06em;transition:color .5s ease}
  .step--on{color:var(--portrait-ink)}
  .step i{display:block;width:5px;height:5px;border-radius:var(--portrait-radius-pill);
    background:var(--portrait-line-strong);transition:background .5s ease,width .5s ease}
  .step--on i{width:16px;background:var(--portrait-primary)}
  @media (max-width:560px){.track{gap:9px}.step{font-size:14px}}

  /* ── 操作 ── */
  .foot{display:grid;gap:12px;justify-items:center;width:100%}
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;
    gap:16px;min-height:78px;min-width:min(420px,88vw);border:0;
    border-radius:var(--portrait-radius-pill);color:#fff;cursor:pointer;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:22px;font-weight:700;letter-spacing:.18em;text-indent:.18em;
    padding:0 46px;
    background:linear-gradient(135deg,#2c66c4 0%,#1e50a2 100%);
    text-shadow:0 1px 2px rgba(16,42,86,.36);
    animation:pulse 2.8s ease-in-out infinite;
    transition:transform .12s ease;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--portrait-line-strong);outline-offset:4px}
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 24px rgba(30,80,162,.32), 0 0 0 0 rgba(44,102,196,.44)}
    55%    {box-shadow:0 10px 30px rgba(30,80,162,.38), 0 0 0 16px rgba(44,102,196,0)} }
  .arw{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;
    border-radius:var(--portrait-radius-pill);background:rgba(255,255,255,.22);
    font-size:16px;font-weight:400;text-indent:0;letter-spacing:0;text-shadow:none}
  @media (max-width:560px){.btn{font-size:19px;min-height:70px}}
  @media (prefers-reduced-motion:reduce){.btn{animation:none}}
  .aside{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:16px;color:var(--portrait-muted);letter-spacing:.03em;line-height:1.8}
  /* 装いとお棺への控えめな入口 */
  .link2{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:17px;color:var(--portrait-ink);letter-spacing:.04em;
    text-decoration:none;border-bottom:1px solid var(--portrait-line-strong);
    padding-bottom:2px}
  .link2:hover{color:var(--portrait-primary-dark)}
  /* ホーム画面への追加（Android・デスクトップChrome） */
  .install{display:none;align-items:center;gap:12px;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:16px;color:var(--portrait-muted)}
  .install.on{display:flex}
  .install button{min-height:44px;border:1px solid var(--portrait-line-strong);
    border-radius:var(--portrait-radius-pill);background:var(--portrait-card);
    color:var(--portrait-ink);font:inherit;font-size:16px;padding:0 18px;cursor:pointer}
</style>

<div class="top">
  <div class="head">
    <div class="brand">ITOWA</div>
    <h1>遺影・装い・祭壇を、<br><span class="em">1枚の完成イメージ</span>に</h1>
    <p class="sub">お手持ちの一枚から、ご葬儀当日の全体像を、その場で。</p>
  </div>

  <div class="stage">
    <div class="frame" id="frame"></div>
    <div class="track" id="track"></div>
  </div>

  <div class="foot">
    <button type="button" class="btn" id="start">体験する<span class="arw">›</span></button>
    <a class="link2" href="./pair.html">装いとお棺の取り合わせを見る</a>
    <p class="aside">お持ちのお写真で試したい方は、スタッフにお声がけください。</p>
    <div class="install" id="install">
      <span>ホーム画面に入れておくと、すぐに開けます。</span>
      <button type="button" id="installBtn">追加する</button>
    </div>
  </div>
</div>

const STEPS=[
  {key:'portrait', name:'遺影'},
  {key:'figure',   name:'お姿'},
  {key:'wear',     name:'装い'},
  {key:'coffin',   name:'お棺'},
  {key:'altar',    name:'祭壇'},
];
const HOLD=3200;   // 1枚あたりの表示時間

const frame=document.getElementById('frame');
const track=document.getElementById('track');

STEPS.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='shot'+(i===0?' shot--on':'');
  const im=document.createElement('img');
  im.src=A[s.key]; im.alt=''; im.decoding='async';
  d.append(im); frame.append(d);

  const t=document.createElement('span');
  t.className='step'+(i===0?' step--on':'');
  t.innerHTML='<i></i>'+s.name;
  track.append(t);
});

let i=0;
setInterval(()=>{
  const shots=frame.querySelectorAll('.shot');
  const tabs=track.querySelectorAll('.step');
  shots[i].classList.remove('shot--on');
  tabs[i].classList.remove('step--on');
  i=(i+1)%STEPS.length;
  shots[i].classList.add('shot--on');
  tabs[i].classList.add('step--on');
}, HOLD);

/* 体験するを押した回数だけを数える */
document.getElementById('start').onclick=()=>{
  try{ if(window.posthog) posthog.capture('kv3_demo_start'); }catch(e){}
  location.href='./demo.html';
};

/* 一度開いた画面を端末に残す。会場の電波が切れても動くように */
if('serviceWorker' in navigator){
  addEventListener('load',function(){navigator.serviceWorker.register('./sw.js');});
}

/* ホーム画面への追加。iOS は共有メニューからの操作になるため出ない */
let deferred=null;
addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferred=e;
  document.getElementById('install').classList.add('on');
});
document.getElementById('installBtn').onclick=()=>{
  if(!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(()=>{
    deferred=null;
    document.getElementById('install').classList.remove('on');
  });
};
addEventListener('appinstalled',()=>{
  document.getElementById('install').classList.remove('on');
});
</script>
